<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="0.45" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#4dd4e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc14d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc14d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background so the icon survives maskable cropping. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="180" fill="url(#glow)"/>

  <!-- A roof over a lit orb: house plus the "system is live" mark from the UI. -->
  <path d="M256 118 L400 236 V300 H364 V266 L256 176 L148 266 V300 H112 V236 Z" fill="#eef0f7" opacity="0.9"/>
  <circle cx="256" cy="318" r="66" fill="url(#orb)"/>
  <circle cx="256" cy="318" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
